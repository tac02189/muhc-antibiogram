<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>MUHC Antibiogram 2026</title>
    <meta name="description" content="MUHC University Hospital 2026 Antibiogram — interactive susceptibility lookup for emergency physicians, hospitalists, and clinical staff. Mobile-first." />

    <!-- Icons. %BASE_URL% (Vite substitutes the build's base) keeps these
         base-relative rather than document-relative: a document served at a
         deep path — anything the retired gh-pages branch forwards, which the
         SPA rewrite answers with this shell — would otherwise resolve
         "manifest.webmanifest" against that path and 404 the manifest and
         every icon. Filenames stay -v3-suffixed; see CLAUDE.md "App icons". -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icon-32-v3.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192-v3.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icon-512-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icon-180-v3.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="%BASE_URL%icon-180-v3.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Antibiogram" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MUHC Antibiogram" />
    <meta property="og:title" content="MUHC Antibiogram 2026" />
    <meta property="og:description" content="Interactive susceptibility lookup for the MU Health Care 2026 antibiogram. Organism / antibiotic / empiric / reference." />
    <meta property="og:url" content="https://muhc-antibiogram.web.app/" />
    <meta property="og:image" content="https://muhc-antibiogram.web.app/og-image-v3.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MU Antibiogram — Mizzou gold MU logo over a green/yellow/red susceptibility table with antibiotic capsule" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MUHC Antibiogram 2026" />
    <meta name="twitter:description" content="Interactive susceptibility lookup for the MU Health Care 2026 antibiogram." />
    <meta name="twitter:image" content="https://muhc-antibiogram.web.app/og-image-v3.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-stone-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
